# The manipulation toolset (roboscript.toolsets.manipulation.ManipulationConfig): the Actor's
# physical actions and reach checks, planned with the motion service and executed through the
# env's agent plane. Copy it to configs/manipulation.yaml; a benchmark's launcher may set the
# planner and the table height per run. Which roles and phases see the tools is the method's
# declaration.

# The motion planner, exactly one of: `url`, the motion service's address
# (python -m roboscript.motion --config motion [--port N]); `ready_file`, the file a stack's
# supervisor has the service write, <run_dir>/.roboscript/ready/<service>.json, read when the
# toolset starts (so the service starts first; relative to the repository root); or
# `mock: true`, MockPlanner in-process (MockEnv's robot, tests).
planner:
  url: http://127.0.0.1:18300

# The table height (m) targets must stay above until perception sets the episode's TABLE fact,
# which then wins; null: no table check until then. A configured number, never read from the
# simulator. Where scenes lower the table, use the lowest height: it refuses no target above the
# table, but lets through targets into a table that sits higher, and perception's estimate closes
# that gap. A refusal tells the model how far at least to raise the target. Set your scene's.
table_top_z: null

# Grasps and placements go coarse, then fine: to the pre-pose, then the objects they depend on
# are measured again there (wrist camera close, head view; the scene toolsets' `refine` tool) and
# the rest is built on that geometry. A measurement is taken only when it is ok, at least
# min_confidence sure and moves the object at most max_shift_m; else the coarse estimate stays and
# the receipt says so. After a release the placed object is measured again (`remeasure`).
refine:
  enabled: true
  min_confidence: 0.5
  max_shift_m: 0.05
  cut_max_shift_m: 0.1     # for an object an image border cut (partially_visible); null: max_shift_m
  look_refused: true       # an action refused on such an object's coarse fit looks at it first

# When a single arm's move misses (deviated, stopped short, lost hold, empty grasp, unreachable,
# plan failed) and the other arm's TCP is within this distance of its target, the receipt says the
# other arm may have been in the way.
clearance_m: 0.15
# A grasp pins the held object's frame it was made in where a choice left its front open.
pin_grasp_frames: true
# A robot-frame placement that sets its object down onto the table (or onto what stands on it),
# as the demonstration's table had it, keeps its height over this episode's table, which may
# stand lower (scenes whose table height varies); hand-overs and other releases in the air stay as
# written.
table_releases: true
# plan_arms with a placement and a done criterion relating the object to another one: when both
# arms' grasp, carry and placement plan, the arm whose chain leaves the object nearer where the
# criterion wants it by more than this (m) takes it over the nearer arm.
arm_end_margin_m: 0.05
# ... only where that arm's chain leaves it within this (m) of where the criterion wants it (the
# stage completes the relation; an earlier stage's placement decides nothing).
arm_end_near_m: 0.1
# How long (s) one tool call's grasp and placement searches may plan before they stop and refuse
# (plan_failed) instead of running into the tool's 300 s timeout, which ends the episode.
plan_budget_s: 150.0

# Overrides of single fields of the qpos-waypoint executor's tuning
# (roboscript.contracts.executor.ExecutorConfig, `ManipulationConfig.executor`). The env's
# skillset binds the tuning. A field set here replaces
# the bound value and every other field keeps it. Leave it empty unless an experiment changes a
# field. Its main fields, with example values (uncomment one to override
# it):
executor: {}
#   # Waypoints: the fewest planned points keeping the TCP of every joint-space line between them
#   # within this distance of the planned path.
#   waypoint_tolerance_m: 0.003
#   # A straight move (a grasp's approach, a displacement) is solved by IK at poses this far apart
#   # along its line, twice and four times as densely where the TCP between neighboring solutions
#   # leaves the line by more than the waypoint tolerance (joints turn fast near a wrist
#   # singularity).
#   straight_step_m: 0.02
#   straight_step_deg: 5.0
#   # A joint turning more than this between neighboring IK solutions is a wrist spin (unseen by
#   # the TCP): no straight IK line.
#   max_joint_step_rad: 1.0
#   # Without a straight IK line (a branch change), an orientation-locked plan is taken only if its
#   # TCP stays this close to the line and its orientation to the target's.
#   lock_tolerance_m: 0.02
#   lock_tolerance_deg: 5.0
#   # A free plan turning any joint farther than this in one move is requested once more, then
#   # refused (cuRobo sometimes wraps a joint a full turn). IK solutions along a straight line are
#   # unwrapped to the nearest equivalent first.
#   max_joint_travel_rad: 5.5
#   # A move whose plan fails is planned again up to this many times (fresh cuRobo seeds each
#   # time), then refused; the receipt notes the attempts.
#   replans: 3
#   # After a close, at most this many holds until the measured opening settles.
#   settle_holds: 3
#   # After opening a closed gripper, this many holds, for the fingers to finish opening.
#   open_holds: 4
#   # A place (a contact move while holding) is sent in steps moving the TCP at most this far,
#   # which slows it (null: as any other move); before opening after a place, this many holds let
#   # the object settle. Off by default.
#   place_step_m: null
#   release_holds: 0
#   # A straight move that ends an action deviated is planned once more from where the arm stopped.
#   retry_deviated: true
#   # A move not meant to touch that ends farther than this from its target stopped short (on its
#   # path) or deviated (off it).
#   stop_tolerance_m: 0.015
#   stop_tolerance_deg: 8.0
#   # A displacement (a bounded move) is clamped to this translation and rotation.
#   max_translation_m: 0.2
#   max_rotation_deg: 90.0
#   # A pull on a held part (a closed gripper's turn, a displacement after a pull's close)
#   # follows the part's joint: straight steps moving the TCP this far, the joint refitted to the
#   # achieved TCP positions after each, done within the tolerance; a step making less than the
#   # stall share of its length along the joint stops it (the first is tried the other way once),
#   # and a lost hold is taken again where it last held this many times.
#   follow_step_m: 0.025
#   follow_tolerance_m: 0.003
#   follow_stall: 0.25
#   follow_regrasps: 1
#   # A followed step the executor reports lost_hold for is taken again like any slip (false: it
#   # ends the pull).
#   follow_regrasp_reported: true
#   # A one-arm held path (follow_path) whose end moves on one joint (a door's swing, a drawer's
#   # slide) follows that end so, from the measured TCP; on a part known to move so (a turn; a
#   # slide held by a pull or on a registered articulated part) it goes on past the last waypoint
#   # until the part stops following, by at most this share of the end's travel (0: off).
#   follow_joint_paths: true
#   follow_past: 0.25
#   # After a release the next move first withdraws the TCP straight back along its pointing axis
#   # this far (0: never), farther out of an obstacle box, at most release_withdraw_max_m.
#   release_withdraw_m: 0.05
#   release_withdraw_max_m: 0.15
#   # true: the withdraw is due until the arm's next action that moves it (a
#   # gripper-only action between keeps it due), and only a straight first move back along the
#   # approach is the withdraw itself, not a free one (it may sweep the open fingers through).
#   withdraw_any_move: false
#   # hold_frames: on an object
#   # whose shape looks the same turned, a held path is chosen among the whole's frames in every
#   # such turn too, and a pose grasp's close pins the object's frame to the turn its hold
#   # reproduces (placements are made in the frame they were fitted in). coarse_stops: a coarse,
#   # then fine action whose fine part moved nothing reports the coarse move's outcome (a stop
#   # short). drop_start_colliders: a free move refused as starting in collision is planned clear
#   # of all perceived objects but those the arm touches at its start, before none.
#   hold_frames: true
#   coarse_stops: true
#   drop_start_colliders: true
#   # Pre-checks. Two arms moving at once (`together`) must keep their TCPs this far apart along
#   # their planned paths, a moving arm from its drive target, unless they start closer and come at
#   # most 5 mm closer (leaving a shared hold): else invalid_args.
#   min_arm_gap_m: 0.03
#   # A probed workspace (JSON from a benchmark's probe script, such as
#   # examples/simBenchmarks/<name>/scripts/probe_workspace.py), or null (off): a target TCP
#   # farther than workspace_margin_m from every cell its arm reaches, and out of IK's reach, is
#   # refused as unreachable.
#   workspace: null
#   workspace_margin_m: 0.08
#   # P3 only: the action API refuses, without executing, an immediate repeat of the call that just
#   # failed or was refused (the same call, or every target within these tolerances and the same
#   # gripper commands): rejected_repeat.
#   reject_repeats: false
#   repeat_tolerance_m: 0.005
#   repeat_tolerance_deg: 5.0

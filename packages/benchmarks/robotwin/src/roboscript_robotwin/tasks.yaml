# The 50 RoboTwin 2.0 tasks with their official step limits, in take_action calls, from
# task_config/_eval_step_limit.yml. Categories (what a task needs besides the object it moves, read
# from each task's expert script and success check) serve reporting and the choice of
# demonstrations. The Agent never reads them:
#   C1 articulated: joint state or link poses (4)
#   C2 oriented part: orientation, or a part of the grasped object, decides success (11)
#   C3 receiver point: the target is an annotated point of a receiving object (10)
#   C4 relative placement: the target is another object's pose plus an offset (10)
#   C5 single object: the target is a constant, a displacement or free (15)
# What a task's success check reads (which arm, ...) is referee knowledge: sim/referee.yaml.

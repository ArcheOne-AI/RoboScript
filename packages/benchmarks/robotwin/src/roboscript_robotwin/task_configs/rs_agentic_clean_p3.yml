# RoboTwin task config for RoboScript's P3 official evaluation (packages/benchmarks/robotwin/src/roboscript_robotwin/eval):
# rs_agentic_clean.yml with the official video on (eval_video_log: true), nothing else
# (tests/benchmarks/robotwin checks that). RoboTwin's eval_policy_client.py reads it from
# task_config/, where roboscript_robotwin.eval.install links it.
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: Large_D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: true
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: false
eval_video_log: true

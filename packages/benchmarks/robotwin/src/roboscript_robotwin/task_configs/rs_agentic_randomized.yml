# RoboTwin task config for RoboScript episodes: task_config/demo_randomized.yml
# with these changes, nothing else (tests/benchmarks/robotwin checks that):
#   camera.head_camera_type: D435 -> Large_D435 (640x480); the wrist cameras stay D435
#   data_type.depth: false -> true; rgb, endpose and qpos stay true; segmentations, point
#     clouds, third view and observer stay false
#   collect_data: true -> false; eval_video_log: true -> false (P3 records its own videos)
# eval_mode, the step limit and the expert pre-run are set per episode by roboscript_robotwin.sim.
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.02
  random_head_camera_dis: 0
  random_table_height: 0.03
  random_light: true
  crazy_random_light_rate: 0.02
camera:
  head_camera_type: Large_D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: true
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: false
eval_video_log: false
